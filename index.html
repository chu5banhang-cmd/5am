<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5AM - Khởi Nghiệp Cà Phê Hẻm Sài Gòn (Pixel 2D Top-Down)</title>
    <!-- Font chữ phong cách Pixel / Retro hỗ trợ đầy đủ tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="650"></canvas>
        <div id="playerFormFields">
            <div class="player-field">
                <label for="playerNameInput">Tên chủ quán</label>
                <input type="text" id="playerNameInput" placeholder="Nhập tên..." maxlength="14" value="Chủ Quán" spellcheck="false" autocomplete="off">
            </div>
            <div id="playerBirthdayField" hidden>
                <label for="playerBirthdayInput">Ngày sinh <span>(1–100)</span></label>
                <input type="number" id="playerBirthdayInput" min="1" max="100" step="1" value="1" required>
            </div>
        </div>
    </div>

    <script src="constants.js"></script>
    <script src="game.js"></script>
</body>
</html>
